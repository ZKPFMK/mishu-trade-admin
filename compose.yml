name: mishu-trade-admin
x-service: &service
  build: .
  init: true
  environment: &env
    DATABASE_URL: postgres://trade:${TRADE_DB_PASSWORD:?Set TRADE_DB_PASSWORD}@postgres:5432/trade_admin
    SOURCE_MODE: ${SOURCE_MODE:-mock}
    SOURCE_URL: ${SOURCE_URL:-}
    SOURCE_READ_TOKEN: ${SOURCE_READ_TOKEN:-}
    COOKIE_SECURE: ${COOKIE_SECURE:-1}
    HOST: 0.0.0.0
    PORT: 8920
    DATA_DIR: /app/data
  volumes:
    - files:/app/data
    - local:/app/.local
services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: trade
      POSTGRES_PASSWORD: ${TRADE_DB_PASSWORD:?Set TRADE_DB_PASSWORD}
      POSTGRES_DB: trade_admin
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U trade -d trade_admin]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  bootstrap:
    <<: *service
    command: [node, --import, tsx, scripts/bootstrap.ts]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *service
    ports:
      - "127.0.0.1:8920:8920"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8920/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  worker:
    <<: *service
    command: [node, --import, tsx, apps/worker/src/main.ts]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres:
  files:
  local:
